name: Uygulamayi derle (APK + iPhone sitesi)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Araclari kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ikonlar ve ortak dosyalar
        run: |
          test -f index.html || { echo "index.html depoda bulunamadi"; exit 1; }
          mkdir -p build/icons
          cat > build/icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#15303F"/><path d="M118 400 C 170 330, 240 440, 316 380" stroke="#6F98FF" stroke-width="30" fill="none" stroke-linecap="round" stroke-dasharray="0 50"/><circle cx="118" cy="400" r="34" fill="#6F98FF"/><path d="M340 400 C 300 336, 244 286, 244 206 A96 96 0 1 1 436 206 C 436 286 380 336 340 400Z" fill="#F2B705"/><path d="M296 206 l32 32 l60 -64" stroke="#15303F" stroke-width="28" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          EOF
          for s in 48 72 96 144 180 192 512; do rsvg-convert -w $s -h $s build/icon.svg -o build/icons/icon-$s.png; done
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js -o build/xlsx.full.min.js
          sed 's#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js#xlsx.full.min.js#' index.html > build/index.html
          grep -q 'src="xlsx.full.min.js"' build/index.html

      - name: iPhone icin web sitesi
        run: |
          mkdir -p site/icons
          cp build/index.html build/xlsx.full.min.js site/
          cp build/icons/icon-192.png build/icons/icon-512.png site/icons/
          cp build/icons/icon-180.png site/icons/apple-touch-icon.png
          cat > site/manifest.webmanifest <<'EOF'
          {"name":"Denetim Rotası","short_name":"Denetim","start_url":"./","scope":"./","display":"standalone",
           "background_color":"#0B1C24","theme_color":"#15303F","lang":"tr",
           "icons":[{"src":"icons/icon-192.png","sizes":"192x192","type":"image/png"},
                    {"src":"icons/icon-512.png","sizes":"512x512","type":"image/png","purpose":"any"}]}
          EOF
          cat > site/sw.js <<'EOF'
          const C='denetim-__V__';
          const FILES=['./','index.html','xlsx.full.min.js','manifest.webmanifest','icons/icon-192.png','icons/apple-touch-icon.png'];
          self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(FILES)).then(()=>self.skipWaiting()))});
          self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
          self.addEventListener('fetch',e=>{const r=e.request;if(r.method!=='GET')return;
            e.respondWith(fetch(r).then(res=>{if(res.ok&&new URL(r.url).origin===location.origin){const cp=res.clone();caches.open(C).then(c=>c.put(r,cp))}return res})
              .catch(()=>caches.match(r).then(m=>m||caches.match('index.html'))))});
          EOF
          sed -i "s/__V__/${{ github.run_number }}/" site/sw.js
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Imza anahtari (guncellemeler ayni anahtarla imzalansin)
        run: |
          mkdir -p signing
          if [ ! -f signing/denetim.jks ]; then
            keytool -genkeypair -keystore signing/denetim.jks -alias denetim -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass denetim123 -keypass denetim123 -dname "CN=Denetim Rotasi, O=Kisisel, C=TR"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add signing/denetim.jks
            git commit -m "APK imza anahtari"
            git push || echo "Anahtar depoya yazilamadi; sonraki surumler yeni anahtarla imzalanir"
          fi

      - name: Android projesini olustur
        run: |
          A=android
          P=$A/app/src/main
          mkdir -p $P/java/com/denetim/rotasi $P/assets/www $P/res/values
          cp build/index.html build/xlsx.full.min.js $P/assets/www/
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}; mkdir -p $P/res/mipmap-$n; cp build/icons/icon-$s.png $P/res/mipmap-$n/ic_launcher.png
          done

          cat > $A/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'DenetimRotasi'
          include ':app'
          EOF

          cat > $A/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > $A/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > $A/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          def buildNo = (System.getenv('BUILD_NO') ?: '1').toInteger()
          android {
            namespace 'com.denetim.rotasi'
            compileSdk 34
            defaultConfig {
              applicationId 'com.denetim.rotasi'
              minSdk 24
              targetSdk 34
              versionCode buildNo
              versionName "1." + buildNo
            }
            signingConfigs {
              release {
                storeFile rootProject.file('../signing/denetim.jks')
                storePassword 'denetim123'
                keyAlias 'denetim'
                keyPassword 'denetim123'
              }
            }
            buildTypes {
              release {
                minifyEnabled false
                signingConfig signingConfigs.release
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            lint {
              abortOnError false
              checkReleaseBuilds false
            }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
          EOF

          cat > $P/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <application
              android:label="@string/app_name"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher"
              android:theme="@android:style/Theme.Material.Light.NoActionBar"
              android:allowBackup="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTask"
                android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > $P/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Denetim Rotası</string></resources>
          EOF

          cat > $P/java/com/denetim/rotasi/MainActivity.java <<'EOF'
          package com.denetim.rotasi;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.webkit.WebViewAssetLoader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
            private static final String HOST = "appassets.androidplatform.net";
            private static final String START = "https://" + HOST + "/assets/www/index.html";
            private static final int REQ_FILE = 11, REQ_LOC = 12;
            private WebView web;
            private ValueCallback<Uri[]> fileCb;
            private GeolocationPermissions.Callback geoCb;
            private String geoOrigin;

            @Override
            protected void onCreate(Bundle state) {
              super.onCreate(state);
              getWindow().setStatusBarColor(0xFF15303F);
              web = new WebView(this);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setGeolocationEnabled(true);
              s.setSupportMultipleWindows(false);
              final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                  .setDomain(HOST)
                  .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                  .build();
              web.addJavascriptInterface(new Bridge(), "AndroidBridge");
              web.setWebViewClient(new WebViewClient() {
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  return loader.shouldInterceptRequest(r.getUrl());
                }
                @Override
                public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  if (HOST.equals(u.getHost())) return false;
                  openExternal(u);
                  return true;
                }
              });
              web.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  try {
                    startActivityForResult(Intent.createChooser(i, "Excel dosyası seç"), REQ_FILE);
                  } catch (Exception e) {
                    fileCb = null;
                    return false;
                  }
                  return true;
                }
                @Override
                public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback cb) {
                  if (hasLoc() || Build.VERSION.SDK_INT < 23) { cb.invoke(origin, true, false); return; }
                  geoCb = cb; geoOrigin = origin;
                  requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, REQ_LOC);
                }
              });
              if (state != null) web.restoreState(state);
              if (web.getUrl() == null) web.loadUrl(START);
            }

            private boolean hasLoc() {
              if (Build.VERSION.SDK_INT < 23) return true;
              return checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                  || checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED;
            }

            private void openExternal(Uri u) {
              try {
                Intent i = new Intent(Intent.ACTION_VIEW, u);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                startActivity(i);
              } catch (ActivityNotFoundException e) {
                Toast.makeText(this, "Bu bağlantıyı açacak uygulama yok", Toast.LENGTH_SHORT).show();
              }
            }

            @Override
            protected void onActivityResult(int req, int res, Intent data) {
              super.onActivityResult(req, res, data);
              if (req == REQ_FILE && fileCb != null) {
                Uri[] out = null;
                if (res == RESULT_OK && data != null && data.getData() != null) out = new Uri[]{data.getData()};
                fileCb.onReceiveValue(out);
                fileCb = null;
              }
            }

            @Override
            public void onRequestPermissionsResult(int req, String[] perms, int[] results) {
              super.onRequestPermissionsResult(req, perms, results);
              if (req == REQ_LOC && geoCb != null) {
                geoCb.invoke(geoOrigin, hasLoc(), false);
                geoCb = null;
              }
            }

            @Override
            protected void onResume() {
              super.onResume();
              if (web != null) {
                web.onResume();
                // Uygulamaya donuldugunde "durak tamamlandi mi?" sorusunu tetikler
                web.evaluateJavascript("window.dispatchEvent(new Event('focus'));", null);
              }
            }

            @Override
            protected void onPause() {
              if (web != null) web.onPause();
              super.onPause();
            }

            @Override
            protected void onSaveInstanceState(Bundle out) {
              super.onSaveInstanceState(out);
              if (web != null) web.saveState(out);
            }

            @Override
            public void onBackPressed() {
              if (web != null && web.canGoBack()) web.goBack();
              else super.onBackPressed();
            }

            class Bridge {
              @JavascriptInterface
              public String saveFile(String name, String b64) {
                try {
                  byte[] data = Base64.decode(b64, Base64.DEFAULT);
                  if (Build.VERSION.SDK_INT >= 29) {
                    ContentValues cv = new ContentValues();
                    cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                    cv.put(MediaStore.MediaColumns.MIME_TYPE, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
                    cv.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                    Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                    if (uri == null) return "error";
                    try (OutputStream os = getContentResolver().openOutputStream(uri)) { os.write(data); }
                    return "ok";
                  } else {
                    File dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                    File f = new File(dir, name);
                    try (FileOutputStream os = new FileOutputStream(f)) { os.write(data); }
                    return "ok:" + f.getAbsolutePath();
                  }
                } catch (Exception e) {
                  return "error:" + e.getMessage();
                }
              }
            }
          }
          EOF

      - name: APK derle
        run: |
          cd android
          BUILD_NO=${{ github.run_number }} gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../DenetimRotasi.apk

      - name: APK'yi Surumler (Releases) sayfasina koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Denetim Rotası ${{ github.run_number }}
          body: Telefona indirip kur. Eski sürüm varsa üzerine güncellenir.
          files: DenetimRotasi.apk
          make_latest: true

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
